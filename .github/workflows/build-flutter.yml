name: Build Flutter APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fitflexmobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Verify Flutter installation
        run: flutter doctor -v

      - name: Analyze Dart code
        run: flutter analyze
        continue-on-error: true  # Don't fail the build on analysis warnings

      - name: Run Flutter tests
        run: flutter test
        continue-on-error: true  # Don't fail the build if widget tests fail (Firebase init may fail in CI)

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=API_BASE=https://fitflex-api.bfast.cloud
        env:
          # Firebase config — use placeholder values for CI builds
          # Real builds require actual Firebase config files
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || 'placeholder' }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN || 'placeholder' }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'placeholder' }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID || 'placeholder' }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fitflex-debug-apk
          path: fitflexmobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Build release APK (on tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: flutter build apk --release --dart-define=API_BASE=https://fitflex-api.bfast.cloud
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || 'placeholder' }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN || 'placeholder' }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'placeholder' }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID || 'placeholder' }}

      - name: Upload release APK (on tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: fitflex-release-apk
          path: fitflexmobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

  build-web:
    name: Build Flutter Web (for testing)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fitflexmobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --dart-define=API_BASE=http://localhost:3000
        continue-on-error: true

      - name: Upload web build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitflex-web-build
          path: fitflexmobile/build/web/
          retention-days: 14
