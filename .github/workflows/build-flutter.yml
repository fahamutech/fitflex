name: Build Flutter APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't block CI — Flutter app has missing source files until FahamuTech pushes lib/

    defaults:
      run:
        working-directory: fitflexmobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for required source files
        id: check-source
        run: |
          if [ ! -f "lib/app_scope.dart" ] || [ ! -f "lib/shared/api_client.dart" ]; then
            echo "⚠️ Missing Flutter source files (lib/app_scope.dart, lib/shared/*.dart)."
            echo "FahamuTech needs to push the remaining lib/ files before the APK can build."
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Source files present — proceeding with build."
            echo "skip_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Flutter
        if: steps.check-source.outputs.skip_build != 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        if: steps.check-source.outputs.skip_build != 'true'
        run: flutter pub get

      - name: Verify Flutter installation
        if: steps.check-source.outputs.skip_build != 'true'
        run: flutter doctor -v

      - name: Analyze Dart code
        if: steps.check-source.outputs.skip_build != 'true'
        run: flutter analyze
        continue-on-error: true

      - name: Run Flutter tests
        if: steps.check-source.outputs.skip_build != 'true'
        run: flutter test
        continue-on-error: true

      - name: Build debug APK
        if: steps.check-source.outputs.skip_build != 'true'
        run: flutter build apk --debug
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || 'placeholder' }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN || 'placeholder' }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'placeholder' }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID || 'placeholder' }}

      - name: Upload debug APK
        if: steps.check-source.outputs.skip_build != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: fitflex-debug-apk
          path: fitflexmobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Build release APK (on tags only)
        if: steps.check-source.outputs.skip_build != 'true' && startsWith(github.ref, 'refs/tags/v')
        run: flutter build apk --release
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || 'placeholder' }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN || 'placeholder' }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'placeholder' }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID || 'placeholder' }}

      - name: Upload release APK (on tags only)
        if: steps.check-source.outputs.skip_build != 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: fitflex-release-apk
          path: fitflexmobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Skip build summary
        if: steps.check-source.outputs.skip_build == 'true'
        run: |
          echo "::warning::Flutter APK build skipped — missing source files (lib/app_scope.dart, lib/shared/*.dart). FahamuTech needs to push remaining lib/ files."

  build-web:
    name: Build Flutter Web (for testing)
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't block CI for the same reason

    defaults:
      run:
        working-directory: fitflexmobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for required source files
        id: check-source-web
        run: |
          if [ ! -f "lib/app_scope.dart" ]; then
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            echo "skip_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Flutter
        if: steps.check-source-web.outputs.skip_build != 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        if: steps.check-source-web.outputs.skip_build != 'true'
        run: flutter pub get

      - name: Build web
        if: steps.check-source-web.outputs.skip_build != 'true'
        run: flutter build web --dart-define=API_BASE=http://localhost:3000

      - name: Upload web build
        if: steps.check-source-web.outputs.skip_build != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: fitflex-web-build
          path: fitflexmobile/build/web/
          retention-days: 14

      - name: Skip web build summary
        if: steps.check-source-web.outputs.skip_build == 'true'
        run: |
          echo "::warning::Flutter Web build skipped — missing source files. FahamuTech needs to push remaining lib/ files."
